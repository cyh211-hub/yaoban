name: 问题反馈
description: 反馈可以稳定复现的安装、连接、语音、按键或触控问题
title: "[Bug] "
labels: ["bug", "待确认"]
body:
  - type: markdown
    attributes:
      value: 上传日志或截图前，请删除个人信息、设备地址、语音内容和其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 遥伴版本
      placeholder: 例如 0.10.5（23）
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Mac 与系统
      placeholder: 例如 MacBook Pro M3，macOS 26.x
    validations:
      required: true
  - type: dropdown
    id: remote
    attributes:
      label: 遥控器
      options:
        - 小米蓝牙遥控器 2 Pro（RC003）
        - Apple Siri Remote 第三代 USB-C 版
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开软件开始，按顺序写清操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附经过脱敏的截图或日志，以及是否安装 PacketLogger。

